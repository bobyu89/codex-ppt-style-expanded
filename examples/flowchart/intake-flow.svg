<svg aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img"><title id="title">從需求到風格樣張</title><desc id="desc">開始、釐清需求、判斷資料是否足夠。足夠則製作風格樣張並確認方向；不足則整理補充資料後回到釐清需求。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2A8C8B" /></marker></defs><rect width="1280" height="720" fill="#F6FAFA" /><text font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="42" text-anchor="middle" x="640" y="90" fill="#173D43">從需求到風格樣張</text><polyline stroke-width="3" marker-end="url(#arrow)" points="160,225 230,225" fill="none" stroke="#2A8C8B" /><polyline stroke-width="3" marker-end="url(#arrow)" points="410,225 480,225" fill="none" stroke="#2A8C8B" /><polyline stroke-width="3" marker-end="url(#arrow)" points="660,225 740,225" fill="none" stroke="#2A8C8B" /><text font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="20" text-anchor="middle" x="700" y="207" fill="#173D43">是</text><polyline stroke-width="3" marker-end="url(#arrow)" points="570,290 570,430" fill="none" stroke="#2A8C8B" /><text font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="20" text-anchor="middle" x="594" y="360" fill="#173D43">否</text><polyline stroke-width="3" marker-end="url(#arrow)" points="460,465 320,465 320,260" fill="none" stroke="#2A8C8B" /><text font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="20" text-anchor="middle" x="387" y="446" fill="#173D43">補充後</text><polyline stroke-width="3" marker-end="url(#arrow)" points="960,225 1040,225" fill="none" stroke="#2A8C8B" /><rect x="40" y="190" width="120" height="70" rx="28" fill="#E4F0EF" stroke="#2A8C8B" stroke-width="2" /><text font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="24" text-anchor="middle" x="100.0" y="233.0" fill="#173D43">開始</text><rect x="230" y="190" width="180" height="70" rx="6" fill="#E4F0EF" stroke="#2A8C8B" stroke-width="2" /><text font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="24" text-anchor="middle" x="320.0" y="233.0" fill="#173D43">釐清需求</text><polygon points="570.0,160 660,225.0 570.0,290 480,225.0" fill="#E4F0EF" stroke="#2A8C8B" stroke-width="2" /><text font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="24" text-anchor="middle" x="570.0" y="233.0" fill="#173D43">資料足夠？</text><rect x="460" y="430" width="220" height="70" rx="6" fill="#E4F0EF" stroke="#2A8C8B" stroke-width="2" /><text font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="24" text-anchor="middle" x="570.0" y="473.0" fill="#173D43">整理補充資料</text><rect x="740" y="190" width="220" height="70" rx="6" fill="#E4F0EF" stroke="#2A8C8B" stroke-width="2" /><text font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="24" text-anchor="middle" x="850.0" y="233.0" fill="#173D43">製作風格樣張</text><rect x="1040" y="190" width="180" height="70" rx="28" fill="#E4F0EF" stroke="#2A8C8B" stroke-width="2" /><text font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="24" text-anchor="middle" x="1130.0" y="233.0" fill="#173D43">確認方向</text><text font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="26" text-anchor="middle" x="640" y="610" fill="#173D43">節點、文字、連線可於 draw.io 修改</text><text font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" font-size="18" text-anchor="middle" x="640" y="655" fill="#173D43">此 SVG 依相同資料製作，非 draw.io CLI 匯出</text></svg>